      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#0a0612" stop-opacity="0"/>
